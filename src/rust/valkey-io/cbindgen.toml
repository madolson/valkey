# Generates include/valkey_io.h from the crate (make check-rust-header).
language = "C"
include_guard = "VALKEY_IO_H"
autogen_warning = "/* Generated by cbindgen from src/rust/valkey-io (cbindgen.toml). Do not edit:\n * run `make -C src rust-header` and check the result in. */"
sys_includes = ["stddef.h", "stdint.h", "sys/types.h", "sys/uio.h"]
no_includes = true
documentation = true
documentation_style = "c"
style = "type"
cpp_compat = false
usize_is_size_t = true

[defines]
"feature = timing" = "RUST_IO_TIMING"

[export]
include = ["VioSession", "VioCmd", "VioConfig", "VioCallbacks"]
exclude = []

[export.rename]
"Conn" = "VioConn"
"ConnRef" = "VioConnRef"
"ConnHandle" = "VioConnHandle"

[parse]
parse_deps = false

[enum]
prefix_with_name = false
