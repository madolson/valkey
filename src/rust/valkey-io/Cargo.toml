[package]
name = "valkey-io"
version = "0.1.0"
edition = "2021"
publish = false
# benches/ is its own crate (criterion stays out of this lockfile).
autobenches = false

[lib]
crate-type = ["staticlib", "rlib"]

[features]
# Sampled per-stage timing (make RUST_IO_TIMING=yes).
timing = []
# Re-exports internals for the micro-benchmarks in benches/.
bench = []

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
debug = 1
panic = "abort"
codegen-units = 1
lto = true
