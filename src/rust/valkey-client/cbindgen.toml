language = "C"
include_guard = "VALKEY_CLIENT_IO_H"
autogen_warning = "/* Generated by cbindgen from src/rust/valkey-client/src/shape2.rs. Do not edit; run `make rust-client-header`. */"
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
style = "both"
usize_is_size_t = true

[export]
include = ["ClientIoRead"]
exclude = ["sds", "vc_parse_input_buffer", "parseInlineBuffer", "parseMultibulkBuffer"]

[parse]
parse_deps = false
